services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: minigpt
      POSTGRES_PASSWORD: minigpt
      POSTGRES_DB: minigpt
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18+: the volume mounts at /var/lib/postgresql (not .../data as in versions before 18)
      - minigpt-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U minigpt -d minigpt']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minigpt-pgdata:
